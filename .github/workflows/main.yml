name: Run ScheduleDisconnectLight

concurrency:
  group: state-updater1
  cancel-in-progress: false
  
on:
  workflow_dispatch: {}         # ручной запуск
 #  schedule:
 #   - cron: '*/5 * * * *'       # каждые 5 минут по UTC
  repository_dispatch:
     types: [run-from-crone]
env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  ZVONOK_KEY: ${{ secrets.ZVONOK_KEY }}
jobs:
  run:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main



      - name: Create GCP key file
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:GITHUB_WORKSPACE "gcp-key.json"
          '${{ secrets.GCP_SA_KEY }}' | Out-File -FilePath $keyPath -Encoding utf8 -NoNewline
          "Wrote key to: $keyPath"
          # (опционально) проверка что это JSON
          Get-Content $keyPath | Select-Object -First 1
          
      # Токен Deye зберігаємо між запусками в кеші Actions (не в репозиторії), щоб не запитувати
      # новий токен щоразу: кожен виклик Deye рахується в місячній квоті (100 000).
      # Беремо найновіший кеш за префіксом deye-token-.
      - name: Restore Deye token cache
        uses: actions/cache/restore@v4
        with:
          path: deye-token.json
          key: deye-token-${{ github.run_id }}
          restore-keys: |
            deye-token-

      - name: Run EXE
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ZVONOK_KEY: ${{ secrets.ZVONOK_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}\gcp-key.json
          CHAT_ID:  ${{ secrets.CHAT_ID }}
          # Доступ до Deye Cloud (додати в Settings -> Secrets and variables -> Actions)
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_LOGIN: ${{ secrets.DEYE_LOGIN }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_TOKEN_FILE: ${{ github.workspace }}\deye-token.json
          # Передача даних на Worker дашборда (secrets: WORKER_URL, INGEST_SECRET)
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          cd ScheduleDisconnectLight\bin\Debug
          .\ScheduleDisconnectLight.exe

      # Кеш зберігаємо ТІЛЬКИ коли застосунок отримав новий токен (він сам ставить DEYE_TOKEN_REFRESHED=true).
      - name: Save Deye token cache
        if: env.DEYE_TOKEN_REFRESHED == 'true'
        uses: actions/cache/save@v4
        with:
          path: deye-token.json
          key: deye-token-${{ github.run_id }}

      - name: Commit updated appState.json
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Добавляем appState.json и коммитим, если есть изменения
          git add appState.json
          git commit -m "Update appState.json" || echo "No changes to commit"

          # Подтягиваем последние изменения, не ломаясь из-за локальных правок
          git pull --rebase --autostash origin main || echo "Pull failed"

          # Пушим обратно в main
          git push origin HEAD:main || echo "Push failed"
     
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
